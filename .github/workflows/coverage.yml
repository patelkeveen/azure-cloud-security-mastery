name: Coverage register

# The repo must not be able to overstate itself.
#
# COVERAGE.md is generated from the filesystem. If someone adds or removes content
# without regenerating it, the register becomes a claim rather than a measurement -
# which is exactly the failure this repo had before 2026-08-09, when every root-level
# index asserted broad coverage and none of them referenced the content that existed.
#
# This job fails the build when the committed register no longer matches reality.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  coverage-is-current:
    # Windows because the generator uses Windows path conventions, matching the
    # environment this repo is authored in.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify COVERAGE.md matches the filesystem
        shell: pwsh
        run: |
          ./tools/Build-CoverageRegister.ps1 -Check

      - name: Show current coverage
        if: always()
        shell: pwsh
        run: |
          if (Test-Path COVERAGE.md) {
            Get-Content COVERAGE.md -TotalCount 25
          }

  links-resolve:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check relative markdown links in root docs and layer files
        shell: pwsh
        run: |
          $bad = @()
          $docs = @(Get-ChildItem -File -Filter *.md) +
                  @(Get-ChildItem -Recurse -File -Filter 'LAYER-*.md')
          foreach ($d in $docs) {
            $text = Get-Content $d.FullName -Raw
            foreach ($m in [regex]::Matches($text, '\[[^\]]*\]\(([^)#:]+\.(?:md|ps1))\)')) {
              $rel = $m.Groups[1].Value
              $target = Join-Path $d.DirectoryName $rel
              if (-not (Test-Path $target)) {
                $bad += "$($d.Name) -> $rel"
              }
            }
          }
          if ($bad) {
            Write-Host "BROKEN LINKS:" -ForegroundColor Red
            $bad | ForEach-Object { Write-Host "  $_" }
            exit 1
          }
          Write-Host "All relative links resolve." -ForegroundColor Green

  external-links-resolve:
    # A resource map whose links 404 is worse than no resource map: it looks
    # authoritative and sends you nowhere. Five of forty were dead on 2026-08-09.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check every external URL in markdown
        shell: pwsh
        run: |
          $urls = @{}
          Get-ChildItem -Recurse -File -Filter *.md |
            Where-Object { $_.FullName -notmatch '\\\.git\\' } |
            ForEach-Object {
              $f = $_
              foreach ($m in [regex]::Matches((Get-Content $f.FullName -Raw), '\]\((https?://[^)\s]+)\)')) {
                $u = $m.Groups[1].Value
                if (-not $urls.ContainsKey($u)) { $urls[$u] = @() }
                $urls[$u] += $f.Name
              }
            }
          Write-Host "Checking $($urls.Count) unique external URLs..."
          $bad = @()
          foreach ($u in $urls.Keys) {
            try {
              $r = Invoke-WebRequest -Uri $u -Method Head -MaximumRedirection 5 -TimeoutSec 20 -ErrorAction Stop
              if ($r.StatusCode -ge 400) { $bad += "$($r.StatusCode)  $u  [$($urls[$u] -join ', ')]" }
            } catch {
              $c = $_.Exception.Response.StatusCode.value__
              # Some hosts reject HEAD or rate-limit CI. Only fail on definite 404/410.
              if ($c -in 404, 410) { $bad += "$c  $u  [$($urls[$u] -join ', ')]" }
              elseif (-not $c)     { Write-Host "  unreachable (not failing): $u" }
              else                 { Write-Host "  HTTP $c (not failing): $u" }
            }
          }
          if ($bad) {
            Write-Host "DEAD LINKS:" -ForegroundColor Red
            $bad | ForEach-Object { Write-Host "  $_" }
            exit 1
          }
          Write-Host "No dead external links." -ForegroundColor Green
